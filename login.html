<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Secure sign in for the SNG telecom drawing and project management workspace.">
    <meta name="theme-color" content="#102a43">
    <title>Login - SNG Drawing Management System</title>
    <link rel="icon" href="assets/brand/sng-mark.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.webmanifest">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
    <main class="login-shell">
        <a class="login-back-link" href="index.html"><i class="bi bi-arrow-left me-1" aria-hidden="true"></i>HOME</a>
        <section class="login-intro" aria-label="SNG Drawing Management System">
            <img class="login-mark" src="assets/brand/sng-mark.svg" alt="SNG">
            <p class="login-kicker">SLT SERVICES DRAWING OFFICE WORKSPACE</p>
            <h1>Drawings that stay<br><strong>in motion.</strong></h1>
            <p class="login-intro-copy">One focused place for project invoices, invoice drawings and as-built drawings record.</p>
            <div class="login-rule" aria-hidden="true"></div>
            <div class="partner-logo-row" aria-label="Partner organizations">
                <div class="partner-logo-card"><img src="assets/brand/partner-logos/slt-logo.png" alt="SLT"></div>
                <div class="partner-logo-card"><img src="assets/brand/partner-logos/slts-logo.png" alt="SLTS"></div>
            </div>
        </section>
        <section class="card shadow-lg border-0 rounded-4 login-card" aria-labelledby="loginTitle">
            <div class="card-body p-4 p-md-5">
                <div class="login-heading mb-4">
                    <span class="login-heading-icon"><i class="bi bi-shield-lock-fill" aria-hidden="true"></i></span>
                    <div><p class="login-card-kicker mb-1">SECURE ACCESS</p><h2 id="loginTitle" class="fw-bold mb-0">Welcome back</h2></div>
                </div>
                <div class="mb-3"><label class="form-label fw-semibold" for="email">ඊමේල් ලිපිනය</label><input type="email" id="email" class="form-control form-control-lg" placeholder="admin@example.com"></div>
                <div class="mb-4"><label class="form-label fw-semibold" for="password">මුරපදය</label><input type="password" id="password" class="form-control form-control-lg" placeholder="••••••••"></div>
                <button id="loginBtn" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm"><i class="bi bi-arrow-right-circle-fill me-2" aria-hidden="true"></i>Login</button>
                <div id="errorMsg" class="alert alert-danger mt-3 d-none text-center" role="alert"></div>
            </div>
        </section>
        <p class="login-copyright">&copy; <span id="copyrightYear">2026</span> Sameera Nuwan Gunathunga. All rights reserved.</p>
    </main>
    <script type="module" src="js/app.js"></script>
</body>
</html>
